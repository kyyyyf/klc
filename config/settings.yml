# settings.yml — the operational front door (SYSTEM knobs you flip).
#
# One place for the frequently-toggled operational settings, resolved by
# core/skills/settings.py. Every knob below is COMMENTED OUT: while commented,
# the framework falls back to the knob's legacy file (profile.yml / jira.yml /
# clarify.yml / budgets.yml), so an install that has not migrated behaves
# byte-for-byte as before. Uncomment a line here (or in the per-project
# .klc/config/settings.yml, which takes precedence) to override.
#
# Resolution ladder for every knob (project layers before framework layers):
#   .klc/config/settings.yml -> .klc/config/<legacy>.yml
#   -> config/settings.yml   -> config/<legacy>.yml -> built-in default
#
# `klc doctor` validates the keys and value types below.

# Active profile — selects profiles/<name>/{manifest,sgconfig,mcp}.yml
# (language globs, semgrep config, MCP servers, reviewer manifest).
# Legacy: config/profile.yml. Default: generic.
# profile: generic

# Jira mirror integration (optional). Legacy: config/jira.yml.
# jira:
#   enabled: false          # push klc phase -> Jira status on ack. Default: false.
#   mode: mirror            # mirror (auto-push) | managed (manual sync). Default: mirror.

# Interactive clarify-gate dialogue style. Legacy: config/clarify.yml.
# clarify:
#   style: batch            # batch (one grouped ask) | serial (one at a time). Default: batch.

# Autonomous-runner runaway backstop (`klc run`). Legacy: config/budgets.yml.
# The KLC_AUTORUN_CAP env var overrides this.
# autorun:
#   consecutive_auto_transitions: 20   # max consecutive auto transitions. Default: 20.

# Index freshness (KLC-107). `klc install` records hook_mode/hook_location;
# `klc doctor`'s index-hook check reads them back. No legacy file.
# index:
#   hook_mode: direct                  # direct | snippet | disabled. Set by `klc install`.
#   hook_location: .git/hooks/pre-commit   # resolved hooks dir or detected manager name.
#   refresh_budget_seconds: 30         # wall-clock budget for the verb-side lazy refresh.

# Index coverage floor (KLC-106). This knob has NO legacy file: it was
# introduced after settings.yml, so its ladder is
# .klc/config/settings.yml -> config/settings.yml -> built-in 0.25.
# index:
#   coverage:
#     min_ratio: 0.25          # share of the file universe a builder must cover.
#     per_builder:             # optional per-builder override, unset by default.
#       dep_graph: 0.25
#     language_share_threshold: 0.05   # KLC-123: dominant-language floor for the
#                               # retriever's inventory cap. A degraded language
#                               # among the trace's OWN candidate files always
#                               # caps; a degraded language outside them caps
#                               # only if its share of the code universe is at
#                               # or above this floor, otherwise it surfaces as
#                               # an advisory instead. Default: 0.05.

# Ack advisory severity threshold (KLC-117). At or above this severity the
# `advisory` gate signal is dirty and a conditional gate pauses. No legacy file.
# advisory:
#   threshold: medium        # high | medium | low | info. Default: medium.

# Bounded verification runner budgets (KLC-115) — one impl-plan step VERIFY run
# (`klc step verify`), one AC-referencing pytest node, and the whole verification
# arm at one build ack. No legacy file.
# verify:
#   step_budget_seconds: 120    # one impl-plan step VERIFY command. Default: 120.
#   node_budget_seconds: 120    # one AC-referencing pytest node. Default: 120.
#   arm_budget_seconds: 600     # the whole verification arm at one ack (the AC-coverage
#                               # pytest runs; KLC-174 removed the replay arms). Default: 600.

# VERIFY allowlist (KLC-174). `klc step verify` runs a plan step's VERIFY command
# only when EVERY `&&` / `;` / `|` segment starts with an allowed program. Built-in:
# `python3 -m pytest`, `pytest`, `npm test`, `cargo test`, `go test`, `dotnet test`.
# This key is the ONLY way to add programs (each entry is a command prefix). The
# allowlist is not a sandbox: the test code itself still runs, so a committed
# conftest.py can execute anything. A few flags that load code or write outside the
# repo (`-p`, `-c`, `--basetemp`, `--rootdir`, `--junitxml`, `-exec`, `--config`,
# `--eval`) are refused, and so is any `#`.
# verify:
#   allowed_programs: ["make test", "tox"]

# Scope-guard infra paths (KLC-111). Paths outside the module graph, dropped
# before module resolution by the scope-guard and accepted as valid module
# names by the discovery-ack check. A trailing slash is a directory prefix;
# no trailing slash is an exact repo-relative file. No legacy file.
# scope:
#   infra_paths: [".klc/", "hooks/", ".github/", ".gitlab/", "README.md"]

# Build orchestrator (KLC-114, KLC-174). Progress is derived from git and
# build/steps.json; there is no ledger file and no re-run pass. No legacy file.
# build:
#   per_step_review_on_verify: false   # dispatch the per-step reviewer when a
#                               # step is not green after its dispatch. Costs a
#                               # model call, so it opts in.
#   max_reviews_per_step: 3     # hard cap on per-step review gates for one step in one
#                               # build-run; the step is then marked blocked. Default: 3.

# Per-file outline `klc skeleton <file>` (KLC-139): computed on demand, never
# stored. No legacy file.
# skeleton:
#   max_fields: 8          # data members shown per Python class. Default: 8.
#   max_line: 120          # characters per outline line, range included. Default: 120.
#   max_bytes: 2097152     # larger files are refused (2 MiB). Default: 2097152.
