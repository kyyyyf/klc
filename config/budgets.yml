# budgets.yml — warn-only real-spend check and autorunner cap.
#
# Consumed by:
#   - core/skills/budget_guard.py (real_spend_warning)
#   - core/skills/autorunner.py (consecutive_auto_transitions cap)
#
# Why no card-size limits any more (KLC-174): the old soft/hard limits compared
# an ESTIMATE of the prompt size (bytes / 4) with fixed numbers and could block
# a dispatch. Real usage is now imported from transcripts / read from the
# provider envelope, so the check looks at REAL spend and only warns.
#
# real_spend_warn: budget_guard.real_spend_warning(track, ticket) compares the
# ticket's measured input tokens so far (sources `provider` + `transcript`)
# with factor x the median per-ticket total of the last `window` archived
# tickets of the same track. No measured data -> no warning. It never blocks.

version: 1

# Autonomous-runner (KLC-046) consecutive-auto-transition cap. This is a
# runaway backstop for `klc run`, NOT a phase budget counter — it is
# deliberately NOT part of the meta.json:budgets counters or budget._load_limits()
# (those feed gate_policy's budget_overrun signal). autorunner._cap() reads this
# top-level key; a KLC_AUTORUN_CAP env var overrides it.
consecutive_auto_transitions: 20

# Warn when a ticket's measured spend exceeds factor x the median of the last
# `window` archived tickets on its track.
real_spend_warn:
  window: 10
  factor: 1.5
