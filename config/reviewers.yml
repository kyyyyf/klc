# Reviewer configuration for the Codebase Intelligence Framework.
#
# Consumed by:
#   - core/skills/review.py (orchestrates reviewer agents)
#   - scripts/review.py (orchestrates reviewer agents)
#
# Controls the multi-agent code-review pipeline, the mutation-score gate for
# the test agent, and the optional external reviewer.
#
# When adding new keys here, ensure external-review.md and review.md honour
# the defaults they list. Do not commit secrets to this file; API keys are
# read from the environment variable named in api_key_env.
#
# Conditional reviewer schema (profiles/<name>/manifest.yml reviewers.conditional):
#   - path: core/agents/review/<name>.md
#     # Legacy: single diff-regex trigger (backward-compat, still supported)
#     trigger: "regex"
#     # Extended schema (KLC-025): structured trigger evaluation ($0 pre-spawn gate)
#     enabled_for_tracks: [S, M, L]   # omit to run on all tracks
#     triggers:                        # OR semantics; omit to always run
#       - changed_public_api           # diff adds/removes public API symbols
#       - config_or_persistence_change # diff touches config/yaml/sql/env files
#       - security_sensitive_diff      # diff touches auth/crypto/token patterns
#       - dependency_edge_added        # diff adds an import of a module in modules.json
#       # KLC-175 signals (core/skills/review_signals.py), also valid here:
#       - sentinel_hit                 # scan_sentinels found a hit
#       - critical_tier                # classify_tier put a file in the critical tier
#       - hot_path                     # hot_path_globs match or a `# perf:hot` added line

external_reviewer:
  # KLC-175 AC-5: default-on ONLY for the tracks in default_on_tracks (L).
  # S/M run it only when listed in opt_in_tracks (e.g. `opt_in_tracks: [M]`).
  # Opt out with --no-external flag or meta.review.skip_external: true. XS
  # never reaches the external reviewer. The model resolves from config/models.yml's `review-external`
  # pseudo-phase (KLC-120 D-009) — anthropic by default, so the gate checks
  # the `claude` CLI on PATH instead of an API key (AC-10); set an explicit
  # `provider`/`model`/`api_key_env` here to override models.yml (legacy
  # path, still honoured).
  enabled:      true
  min_track:    S                 # XS skips external regardless of enabled
  default_on_tracks: [L]
  opt_in_tracks: []
  model_ref:    review-external   # config/models.yml phase id
  focus:
    - security
    - architecture
    - performance
    - readability
    - test-coverage
  output_format: markdown
  report_path:   .klc/reports/external-review-{timestamp}.md

test:
  # Minimum mutation score (percent). The test agent iterates up to three
  # times to reach this threshold before proceeding.
  # LIVE (KLC-100): read by core/skills/test-writer.py (the mutation gate).
  # Not dead — do NOT delete.
  mutation_score_threshold: 80

  # Per-language overrides of the mutation gate. Use this for languages or
  # build systems where the mutation tool is impractical. Keys match the
  # `language` field that the test agent writes into
  # .klc/index/test-framework.json.
  per_language: {}

review:
  # Severity levels that block merge. Anything in this list contributes to
  # ISSUES_BLOCKING counters returned by each sub-agent.
  blocking_severity:
    - CRITICAL
    - HIGH
  # Whether to launch the five internal sub-agents concurrently.
  parallel_subagents: true
  # KLC-120 D-012: the maximum number of PLANNED+EXECUTED review passes per
  # track (skipped passes never count, D-005). These sit above the
  # practised two-to-three-pass review (F-014), so the cap is insurance on
  # day one; it refuses nothing the project runs today. Over the cap,
  # `scripts/review.py` refuses whole unless `--over-cap` is given — it
  # never silently trims the plan. A track with no key here has no cap.
  max_llm_passes:
    S: 3
    M: 4
    L: 6
  dedupe:
    # KLC-127: token-Jaccard threshold (title + first 200 chars of body,
    # lower-cased, stop words dropped) `findings.dedupe` merges at, inclusive
    # (>=). Read by `findings.min_similarity` via `review_plan.load_reviewers_cfg`;
    # falls back to this same value when the key or the file is missing.
    min_similarity: 0.15

cascade:
  # When enabled, review_cascade.py runs scope_delta + scan_sentinels +
  # classify_tier and computes the layer-2 signals. The thresholds below only
  # set the RECORDED review depth; they pick no reviewer (no cheap pass exists).
  # A signal that cannot be evaluated plans its specialist (fail closed).
  enabled: true

  # Maximum number of peripheral files before the recorded depth is "full".
  peripheral_max_files: 20

  # Maximum total added+removed lines across all peripheral files.
  # A mechanically large diff (e.g. mass rename) warrants a full review
  # even if every individual file is peripheral.
  # Default: 500 lines (added + removed combined).
  peripheral_max_lines: 500

  # KLC-175 layer 2: specialists run only on their signal (see
  # core/skills/review_cascade.specialists_for). Security: a sentinel hit or a
  # critical-tier file. Architecture: changed_public_api or
  # dependency_edge_added. Performance: a hot-path file. Deep-impact: as before.
  specialists:
    performance:
      # Globs of changed paths that count as hot (default none); an added
      # line carrying `# perf:hot` also counts. No code change needed to add one.
      hot_path_globs: []

# KLC-175 AC-8: `## Where to look` in review-report.md (core/skills/review_map.py).
where_to_look:
  # A changed file with at least this many commits in the last 90 days is an
  # "important" hotspot.
  hotspot_min_commits: 8

reports:
  # Retention policy for .klc/reports/. Older runs are pruned at the
  # start of each review.sh invocation.
  retention_runs: 30          # keep the 30 most recent review-*.md files
  retention_partials_days: 7  # delete partials-*/pending-* older than N days
