# phases.yml — the prompt table of the klc state machine (KLC-179).
#
# The order of phases, the lanes, the human decision points and the rework targets
# live in core/skills/rules.py (the facts model and its ordered rule table). This
# file only holds what the rule table cannot know about a phase.
#
# Consumed by:
#   - core/skills/phases.py    (loads this table: prompts, inputs, outputs, pick labels)
#   - core/skills/artefacts.py (renders the per-phase prompt card)
#   - core/skills/plugin_gen.py (which agent prompt belongs to which phase)
#
# Fields per phase:
#
#   id            — unique phase id; the rule table names phases by it.
#   prompt        — agent prompt (relative to the framework root). Empty = no agent
#                   (intake, integrate, observe are checklists the card renders).
#   inputs        — artefacts (relative to the ticket dir) the phase reads; `klc back`
#                   warns when one is missing.
#   outputs       — artefacts the phase writes; superseding the phase deletes them.
#   picks         — the labels `klc go --pick N` accepts; N is the 1-based position.
#                   What a label does is decided by rules.py, not here: an approving
#                   label moves to the next missing fact, a rework label clears facts
#                   and returns to the first missing one. Only the approvals of the
#                   spec and the design are human decision points; every other
#                   approval auto-passes when gate_policy finds its signals clean.
#   pick_required — optional, default true when there are picks. `integrate` sets it
#                   to false (its single pick is implied).
#
# A ticket's `meta.json:phase` holds `<phase-id>:<state>` with state work,
# ack-needed or ack, or one of the terminals `archived` / `cancelled`.

phases:
  - id: intake
    prompt: ""
    picks: [confirm-route, force-full-discovery]
    inputs: []
    outputs: ["raw.md", "meta.json"]

  - id: discovery-lite
    prompt: "core/agents/discovery-lite.md"
    picks: [approve, needs-rework, upgrade-to-full]
    inputs: ["raw.md"]
    outputs: ["spec.md", "test-plan.md", "impl-plan.md"]

  - id: discovery
    prompt: "core/agents/discovery.md"
    picks: [approve, needs-rework]
    inputs: ["raw.md"]
    outputs: ["spec.md"]

  - id: acceptance-test-plan
    prompt: "core/agents/test-planner.md"
    picks: [approve, needs-rework]
    inputs: ["spec.md"]
    outputs: ["test-plan.md"]

  - id: design
    prompt: "core/agents/design.md"
    picks: [option-A-minimal, option-B-clean, option-C-scalable, needs-rework, revise-impl-plan]
    inputs: ["spec.md", "test-plan.md"]
    outputs: ["design.md", "impl-plan.md"]

  - id: build
    prompt: "core/agents/impl.md"
    picks: [approve]
    inputs: ["spec.md", "impl-plan.md"]
    outputs: ["build/steps.json"]

  - id: review
    prompt: "core/agents/review.md"
    picks: [approve, request-changes]
    inputs: ["spec.md"]
    outputs: ["review-report.md"]

  - id: manual
    prompt: "core/agents/manual-check.md"
    picks: [passed, failed]
    inputs: ["spec.md"]
    outputs: []

  - id: integrate
    prompt: ""
    pick_required: false
    picks: [merged]
    inputs: []
    outputs: []

  - id: observe
    prompt: ""
    picks: [clean, regression, rollback]
    inputs: []
    outputs: []

  - id: learn
    prompt: "core/agents/retrospective.md"
    picks: [archive, extract-to-claudemd]
    inputs: []
    outputs: ["retrospective.md"]
