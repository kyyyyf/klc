# ast-grep rule: Rust `pub` items at module level.
#
# Covers the declarations most likely to be part of a crate's public API.
# Nested visibility modifiers (`pub(crate)`, `pub(super)`) are intentionally
# excluded — those are internal.
#
# KLC-103 F-104 / Q-102: a bare `pattern: "pub fn ..."` ALSO matches
# `pub(crate) fn ...` — ast-grep's literal `pub` token matches the
# `visibility_modifier` node's `pub` keyword regardless of a trailing
# `(crate|super|...)` restriction (verified: `pub($$$VIS) fn ...` as an
# explicit exclusion pattern does NOT itself match `pub(crate) fn ...`
# either, so a pattern-level exclusion can't distinguish the two — a
# `not: {regex: "^pub\\("}` on the matched text is what reliably excludes
# the restricted-visibility form).

id: rust-exported-symbols
language: rust
metadata:
  extensions: [".rs"]
rule:
  all:
    - any:
        - pattern: "pub fn $NAME($$$ARGS) $$$RET { $$$BODY }"
        - pattern: "pub async fn $NAME($$$ARGS) $$$RET { $$$BODY }"
        - pattern: "pub struct $NAME { $$$FIELDS }"
        - pattern: "pub struct $NAME($$$TUPLE);"
        - pattern: "pub enum $NAME { $$$VARIANTS }"
        - pattern: "pub trait $NAME { $$$BODY }"
        - pattern: "pub type $NAME = $RHS;"
        - pattern: "pub const $NAME: $T = $RHS;"
        - pattern: "pub static $NAME: $T = $RHS;"
    - not:
        regex: "^pub\\("
    # KLC-108 step-2 (AC-1/AC-3): top-level only — a `pub fn`/`pub struct`
    # NESTED inside another function's body is legal Rust but not module
    # scope. `stopBy: end` walks every ancestor, not just the immediate
    # parent.
    - not:
        inside: {kind: function_item, stopBy: end}
message: Public Rust item

tests:
  valid:
    - |
      pub fn add(a: i32, b: i32) -> i32 { a + b }
    - |
      pub struct Point { pub x: i32, pub y: i32 }
    - |
      pub const MAX_SIZE: usize = 1024;
  invalid:
    - |
      fn internal() -> i32 { 0 }
    - |
      pub(crate) fn crate_only() {}
    - |
      pub(super) struct Restricted { x: i32 }
    - |
      // KLC-108 AC-1: in-body case
      fn wrapper() {
          let local = 1;
          pub fn helper() -> i32 { local }
      }
