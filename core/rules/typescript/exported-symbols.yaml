# ast-grep rule: TypeScript exported declarations.
#
# KLC-103: rewritten onto `kind: export_statement` + `has:` so the SAME rule
# captures the plain, type-annotated, return-type-annotated, generic,
# `extends`, and `abstract` forms in one clause — the old text-pattern list
# only matched the plain forms (spec.md Defect 1 / F-103). Anchoring on
# `export_statement` also delivers AC-4 for free: a declaration nested inside
# a function/method body is never an `export_statement`, so it cannot match.
#
# `export default $EXPR` is a SEPARATE, guarded clause: it must not
# double-count a named `function_declaration`/`class_declaration` that the
# first clause's `export_statement` already owns (`export default class Foo
# {}` is one export_statement whose child IS a class_declaration).
#
# Sibling files: exported-symbols-tsx.yaml (language: tsx, same kind list —
# TSX's grammar is a superset of TS's) and exported-symbols-js.yaml
# (language: javascript, a NARROWER kind list — plain JS's grammar does not
# have abstract_class_declaration/interface_declaration/type_alias_declaration/
# enum_declaration, and ast-grep validates kind names against `language:` at
# PARSE time, so keeping the full TS kind list under `language: javascript`
# aborts the WHOLE merged ruleset scan, not just this file — see KLC-103 F-1).

id: ts-exported-symbols
language: typescript
metadata:
  extensions: [".ts"]
rule:
  all:
    - any:
        - kind: export_statement
          has:
            any:
              - kind: function_declaration
                has: {field: name, pattern: $NAME}
              - kind: class_declaration
                has: {field: name, pattern: $NAME}
              - kind: abstract_class_declaration
                has: {field: name, pattern: $NAME}
              - kind: interface_declaration
                has: {field: name, pattern: $NAME}
              - kind: type_alias_declaration
                has: {field: name, pattern: $NAME}
              - kind: enum_declaration
                has: {field: name, pattern: $NAME}
              - kind: lexical_declaration
                has:
                  kind: variable_declarator
                  has: {field: name, pattern: $NAME}
        # `export default React.memo(X)` / `export default 42` — guarded so a
        # named default declaration is not captured twice (the export_statement
        # clause above already owns `export default class/function X {}`).
        - all:
            - pattern: export default $EXPR
            - not:
                has:
                  any:
                    - kind: function_declaration
                    - kind: class_declaration
        - pattern: module.exports.$NAME = $RHS
    # KLC-108 step-2 (AC-1/AC-3): top-level only. The export_statement /
    # export-default clauses above can never sit inside a function body in
    # the first place (a nested statement is never an `export_statement`),
    # so this clause's real job is the bare `module.exports.$NAME = $RHS`
    # pattern, which has no such anchor of its own. `stopBy: end` walks
    # every ancestor, not just the immediate parent.
    - not:
        inside: {kind: statement_block, stopBy: end}
message: Exported TS declaration

tests:
  valid:
    - |
      export function add(a: number, b: number): number { return a + b; }
    - |
      export class Point { x = 0; y = 0; }
    - |
      export const MAX_SIZE = 1024;
    - |
      export type ID = string;
    - |
      export default class App {}
    - |
      export const TYPED: number = 2;
    - |
      export function generic<T>(x: T): T { return x; }
    - |
      export class Foo extends Bar {}
    - |
      export abstract class Baz {}
    - |
      export interface IFoo extends IBar {}
    - |
      export enum Color { Red, Green }
    - |
      export default React.memo(Comp);
  invalid:
    - |
      function addInternal(a: number, b: number) { return a + b; }
    - |
      class PrivatePoint { x = 0; }
    - |
      function notExported() {
        const local = 1;
        class LocalCls {}
      }
    - |
      // KLC-108 AC-1: in-body case
      function wrapper() {
        if (true) {
          module.exports.sneaky = 1;
        }
      }
