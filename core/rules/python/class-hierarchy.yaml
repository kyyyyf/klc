# ast-grep rule: Python classes that declare at least one base class.
#
# Used to build a rough class hierarchy when the LSP is unavailable.

id: py-class-hierarchy
language: python
metadata:
  extensions: [".py"]
rule:
  all:
    - pattern: "class $NAME($$$BASES): $$$BODY"
    # KLC-108 step-2 (AC-1/AC-2): top-level (module- or class-scope) only —
    # see public-api.yaml's comment for why `stopBy: end` is required.
    - not:
        inside: {kind: function_definition, stopBy: end}
message: Class with explicit bases

tests:
  valid:
    - |
      class Child(Parent):
          pass
    - |
      class S(Base, Mixin):
          pass
  invalid:
    - |
      class Orphan:
          pass
    - |
      # KLC-108 AC-1: in-body case
      def build():
          class Nested(Base):
              pass
          return Nested
