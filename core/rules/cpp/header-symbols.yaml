# ast-grep rule: C++ header-declared symbols.
#
# Scope this rule to header files (*.hpp, *.h, *.hxx) when invoking ast-grep:
#   ast-grep --lang cpp --pattern-file ... --glob "**/*.hpp" --glob "**/*.h"
#
# Note: ast-grep 0.42 parses the right-hand `;` in `class X { ... };` as a
# sibling statement, so patterns with a trailing semicolon fail with "Multiple
# AST nodes detected". We match the declaration without the semicolon; the
# class/struct node itself is what we want.

id: cpp-header-symbols
language: cpp
metadata:
  extensions: [".hpp", ".h", ".hxx"]
rule:
  all:
    - any:
        - pattern: "class $NAME"
        - pattern: "struct $NAME"
        - pattern: "namespace $NS { $$$BODY }"
    # KLC-108 step-2 (AC-1/AC-3): top-level only — a local class/struct
    # declared inside a free function's body is legal C++ but not header
    # surface. `stopBy: end` walks every ancestor, not just the immediate
    # parent.
    - not:
        inside: {kind: function_definition, stopBy: end}
message: Header-visible C++ symbol

tests:
  valid:
    - |
      class Widget { int x; };
    - |
      struct Point { int x; int y; };
    - |
      namespace app { int value; }
  invalid:
    - |
      int add(int a, int b);
    - |
      int total = 0;
    - |
      // KLC-108 AC-1: in-body case
      void Impl() {
        class LocalC { int y; };
        struct LocalS { int z; };
      }
